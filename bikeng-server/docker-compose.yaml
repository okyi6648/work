version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: huoyanjinjing-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: huoyanjinjing
      MYSQL_USER: huoyanjinjing
      MYSQL_PASSWORD: huoyanjinjing123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: huoyanjinjing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: huoyanjinjing-server
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HUOYANJINJING_MYSQL_HOST=mysql
      - HUOYANJINJING_MYSQL_PORT=3306
      - HUOYANJINJING_MYSQL_USER=huoyanjinjing
      - HUOYANJINJING_MYSQL_PASSWORD=huoyanjinjing123
      - HUOYANJINJING_MYSQL_DBNAME=huoyanjinjing
      - HUOYANJINJING_REDIS_HOST=redis
      - HUOYANJINJING_REDIS_PORT=6379
    volumes:
      - ./configs:/app/configs

volumes:
  mysql_data:
  redis_data:
